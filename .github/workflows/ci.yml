# agent-workflow-kit CI (AGENT-6 test foundation). Based on: template/.github/workflows/ci.yml (same action versions, gitleaks block, concurrency/permissions).
# Differences: no detect/node/flutter blocks (this repo is Python + bash only); bandit and a coverage threshold were added.
name: CI

on:
  push:
    branches: [main, 'gece/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The binary is run directly (as in the template): version pinned, SHA256 verified.
      - name: gitleaks
        env:
          GL_VERSION: 8.30.1
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_checksums.txt"
          grep linux_x64.tar.gz sums.txt | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          # Only this branch's history: a leak on another branch must not turn every branch red (that branch is red in its own CI).
          ./gitleaks git --redact --no-banner -v --log-opts="HEAD" .

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: tools
        # ruff: same version as template/.pre-commit-config.yaml (v0.16.10); bandit: the version verified locally.
        run: python -m pip install --upgrade pip "ruff==0.16.10" "bandit[toml]==1.9.4" pytest pytest-cov
      - run: ruff check .
      - run: ruff format --check .
      # Bandit gate: medium severity and above (-ll). Low findings (B404/B603/B607: subprocess with an argv list) are printed below for information.
      - run: bandit -r hooks -c pyproject.toml -ll
      - name: bandit (low severity, informational)
        run: bandit -r hooks -c pyproject.toml -q || true
      # If 0 tests are collected pytest returns 5 -> red (no fake green). Coverage threshold: pyproject.toml [tool.coverage.report] fail_under.
      - run: pytest -q --cov --cov-report=term-missing --durations=10

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # One-command demo (README "Quick start"): exit code 0 and a "DEMO COMPLETE" line are required.
      - run: bash demo.sh | tee demo.out
      - run: grep -q 'DEMO COMPLETE' demo.out
